<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>subgrid - terrain model vs DEM</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0e14; overflow: hidden; }
      #app { width: 100%; height: 100%; }
      #hud {
        position: absolute; top: 12px; left: 12px; color: #cfd8e3;
        font: 13px/1.4 system-ui, sans-serif; background: rgba(10, 14, 20, 0.6);
        padding: 10px 14px; border-radius: 6px; max-width: 320px;
      }
      #hud label { display: block; margin-top: 6px; }
      #compass {
        position: absolute; top: 12px; right: 12px; width: 48px; height: 48px;
        color: #cfd8e3; font: bold 13px/1 system-ui, sans-serif; text-align: center;
        transition: transform 0.05s linear;
      }
      #compass-arrow { font-size: 22px; line-height: 1; }
      .pin { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
      .pin-dot {
        width: 9px; height: 9px; border-radius: 50%;
        background: #ff3b3b; border: 1.5px solid white;
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
      }
      .pin-text {
        margin-top: 3px; font: 11px/1 system-ui, sans-serif; color: #fff;
        background: rgba(10, 14, 20, 0.75); padding: 2px 5px; border-radius: 3px;
        white-space: nowrap;
      }
      .elev-label {
        font: 10px/1 system-ui, sans-serif; color: #fff;
        background: rgba(10, 14, 20, 0.55); padding: 1px 3px; border-radius: 2px;
        white-space: nowrap; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <strong>Copper/Frisco, CO - HRRR terrain vs DEM</strong>
      <label><input type="checkbox" id="toggle-hrrr" checked /> HRRR model terrain (3km blocks)</label>
      <label>HRRR opacity <input type="range" id="opacity-hrrr" min="0" max="1" step="0.05" value="0.65" /></label>
      <label><input type="checkbox" id="toggle-imagery" checked /> Aerial imagery on DEM</label>
      <label><input type="range" id="exaggeration" min="1" max="4" step="0.25" value="1.5" /> vertical exaggeration <span id="exaggeration-value">1.5x</span></label>
    </div>
    <div id="compass"><div id="compass-arrow">&#9650;</div>N</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
