<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>subgrid - terrain model vs DEM</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0e14; overflow: hidden; }
      #app { width: 100%; height: 100%; }
      #hud {
        position: absolute; top: 12px; left: 12px; color: #cfd8e3;
        font: 13px/1.4 system-ui, sans-serif; background: rgba(10, 14, 20, 0.6);
        padding: 10px 14px; border-radius: 6px; max-width: 320px;
      }
      #hud label { display: block; margin-top: 6px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <strong>Golden, CO - HRRR terrain vs DEM</strong>
      <label><input type="checkbox" id="toggle-hrrr" checked /> HRRR model terrain (3km blocks)</label>
      <label>HRRR opacity <input type="range" id="opacity-hrrr" min="0" max="1" step="0.05" value="1" /></label>
      <label><input type="checkbox" id="toggle-dem" checked /> DEM surface (~57m)</label>
      <label>DEM opacity <input type="range" id="opacity-dem" min="0" max="1" step="0.05" value="0.55" /></label>
      <label><input type="range" id="exaggeration" min="1" max="4" step="0.25" value="1.5" /> vertical exaggeration</label>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
